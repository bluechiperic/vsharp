name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Fetch Z3 4.12.2 natives
        shell: bash
        run: ./build/fetch-z3.sh
      - name: Test
        run: dotnet test VSharp.sln -c Release --nologo

  package:
    name: package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y g++-aarch64-linux-gnu rpm zip unzip patchelf binutils
      - name: Cache cross-built Z3 natives
        uses: actions/cache@v4
        with:
          path: build/.cache/z3
          key: z3-4.12.2-${{ hashFiles('build/fetch-z3.sh', 'build/z3/glibc-compat.h', 'build/z3/VSharp.Z3.nuspec') }}
      - name: Build packages
        shell: bash
        run: ./build/package.sh --skip-test
      # Code signing is optional and not run. Plug it in before the artifact upload:
      #   Windows Authenticode (secrets WINDOWS_PFX_B64, WINDOWS_PFX_PASSWORD):
      #     echo "$WINDOWS_PFX_B64" | base64 -d > cert.pfx
      #     signtool sign /fd SHA256 /f cert.pfx /p "$WINDOWS_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 artifacts/vsharpc-*-win-*.msi
      #   macOS notarization runs in the macos-pkg job (secrets APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER):
      #     codesign --sign "Developer ID Application: ..." --timestamp vsharpc
      #     xcrun notarytool submit vsharpc-*.pkg --key apple-key.p8 --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait
      #     xcrun stapler staple vsharpc-*.pkg
      # Leave those secrets unset and the packages stay unsigned. SHA256SUMS is the check.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: vsharpc-packages
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.msi
            artifacts/*.nupkg
            artifacts/SHA256SUMS
            artifacts/homebrew/**
            artifacts/winget/**
          if-no-files-found: error

  windows-msi:
    name: Windows MSI
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: vsharpc-packages
          path: dist
      - name: Build MSI with WiX 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install wix --tool-path .tools --version 5.0.2
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem dist -Filter 'vsharpc-*-win-*.zip' | ForEach-Object {
            if ($_.Name -notmatch '^vsharpc-(.+)-(win-x64|win-arm64)\.zip$') { throw "unexpected zip name $($_.Name)" }
            $ver = $Matches[1]
            $rid = $Matches[2]
            $arch = if ($rid -eq 'win-arm64') { 'arm64' } else { 'x64' }
            $msiVer = if ($ver -match '^(\d+)\.(\d+)\.(\d+)') { "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" } else { '0.0.0.0' }
            $stage = Join-Path $env:TEMP "vsharpc-$rid"
            if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
            Expand-Archive $_.FullName -DestinationPath $stage
            $dir = (Get-ChildItem $stage -Directory | Select-Object -First 1).FullName
            & .\.tools\wix.exe build (Resolve-Path 'packaging/wix/vsharpc.wxs') -arch $arch -d "Version=$msiVer" -d "PublishDir=$dir" -o "artifacts/vsharpc-$ver-$rid.msi"
          }
      # Authenticode hook (not run). With WINDOWS_PFX_B64 and WINDOWS_PFX_PASSWORD:
      #   signtool sign /fd SHA256 /f cert.pfx /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 artifacts\*.msi
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: vsharpc-windows-msi
          path: artifacts/*.msi
          if-no-files-found: error

  macos-pkg:
    name: macOS pkg
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsharpc-packages
          path: artifacts
      - name: Build component pkgs
        shell: bash
        run: |
          shopt -s nullglob
          args=()
          for f in artifacts/vsharpc-*-osx-*.tar.gz; do args+=(--pkg-only "$f"); done
          ./build/package.sh "${args[@]}"
      # Notarization hook (not run). With APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID, and
      # APPLE_NOTARY_ISSUER set, codesign the binary inside the tarball, rebuild the pkg,
      # then: xcrun notarytool submit artifacts/vsharpc-*-osx-*.pkg --key ... --wait
      # and xcrun stapler staple. Unsigned pkgs install after the user overrides Gatekeeper.
      - name: Upload pkgs
        uses: actions/upload-artifact@v4
        with:
          name: vsharpc-macos-pkg
          path: artifacts/*.pkg
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, macos-pkg, windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: vsharpc-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          find . -type f ! -name SHA256SUMS | sort | while IFS= read -r f; do
            f=${f#./}
            echo "$(sha256sum "$f" | awk '{print $1}')  $f" >> SHA256SUMS
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          body: |
            Self-contained `vsharpc` builds for Windows, macOS, and Linux, plus a `dotnet tool` package.
            Install steps are in the repository README. `SHA256SUMS` covers every file.
            Packages are not signed. Authenticode, notarization, a Homebrew tap, winget, and nuget.org are maintainer follow-ups; the workflow comments mark where each one plugs in.
      - name: Push dotnet tool to nuget.org (optional)
        if: ${{ secrets.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "dist/vsharpc.*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
